<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Verba: a V where two voices meet, mine (pearl white) and the other side's (gold). The dot is the words exchanged between them. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26262b"/>
      <stop offset="1" stop-color="#0c0c0f"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".3" cy="0" r=".9">
      <stop offset="0" stop-color="#fff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pearl" gradientUnits="userSpaceOnUse" x1="0" y1="56" x2="0" y2="206">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#d9d2c4"/>
    </linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="56" x2="0" y2="206">
      <stop offset="0" stop-color="#f6dfa6"/>
      <stop offset="1" stop-color="#b2832f"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#ground)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#sheen)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="54.5" fill="none" stroke="#f0d6a0" stroke-opacity=".22" stroke-width="3"/>
  <line x1="72" y1="70" x2="128" y2="192" stroke="url(#pearl)" stroke-width="32" stroke-linecap="round"/>
  <line x1="184" y1="70" x2="128" y2="192" stroke="url(#gold)" stroke-width="32" stroke-linecap="round"/>
  <circle cx="128" cy="78" r="13" fill="url(#pearl)"/>
</svg>
